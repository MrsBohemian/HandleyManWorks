<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handley Works</title>
<style>
  body {
    margin: 0;
    background: #a84420;
  }

  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ceiling-fan { object-position: left top; }

  .bus-stop {
    object-position: right 75%;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }

  .logo {
    position: absolute;
    top: 27%;
    width: clamp(76px, 9vw, 160px);
    aspect-ratio: 1;
    object-fit: contain;
    transform: translate(-50%, -50%);
  }

  .handley-man { left: 13%; }
  .handley-works { left: 38%; }

  @media (max-width: 640px) {
    .ceiling-fan { object-position: 24% top; }
    .bus-stop { object-position: 80% center; }
    .handley-man { left: 18%; top: 54%; }
    .handley-works { left: 56%; top: 17%; }
  }
</style>
</head>
<body>
  <main class="hero">
    <img class="photo ceiling-fan" src="ceilingfan.png" alt="Ceiling fan installation">
    <img class="photo bus-stop" src="busstop.png" alt="Circular bus shelter">
    <img class="logo handley-man" src="handleyman.png" alt="The Handley Man">
    <img class="logo handley-works" src="handleyworks.png" alt="Handley Works">
  </main>
</body>
</html>
