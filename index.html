<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handley Works</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f5eee3;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem clamp(1rem, 5vw, 4rem);
  }

  header img {
    display: block;
    width: clamp(100px, 16vw, 180px);
    height: clamp(45px, 6vw, 58px);
    object-fit: contain;
  }

  .hero {
    position: relative;
    min-height: clamp(360px, 75svh, 850px);
    background: #593e2f;
  }

  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ceiling-fan { object-position: left center; }

  .bus-stop {
    object-position: right center;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
</style>
</head>
<body>
  <header>
    <img src="handleyworks.png" alt="Handley Works">
    <img src="handleyman.png" alt="The Handley Man">
  </header>
  <main class="hero">
    <img class="ceiling-fan" src="ceilingfan.png" alt="Ceiling fan installation">
    <img class="bus-stop" src="busstop.png" alt="Circular bus shelter">
  </main>
</body>
</html>
