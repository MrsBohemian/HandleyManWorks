<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handley Works</title>
<style>
  body {
    margin: 0;
    background: #f5eee3;
  }

  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    box-sizing: border-box;
    border-block: clamp(64px, 15svh, 176px) solid #f5eee3;
    background: linear-gradient(165deg, #903418, #ac4725 62%, #a64222);
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ceiling-fan {
    inset: 24% auto auto 0;
    width: 80%;
    height: 83%;
    object-fit: fill;
    mask-image: linear-gradient(to bottom, transparent, black 18%),
      linear-gradient(to right, black 88%, transparent);
    mask-composite: intersect;
  }

  @media (min-aspect-ratio: 8/5) and (min-width: 900px) {
    .bus-scene .bus-stop {
      height: 109%;
      top: auto;
    }
  }

  .bus-scene {
    position: absolute;
    inset: 0;
    background: linear-gradient(#659bd4, #a9c9e9 65%, #e5ded1);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }

  .bus-stop {
    inset: 0 0 0 auto;
    width: auto;
    max-width: 100%;
    object-position: right bottom;
    mask-image: linear-gradient(to right, transparent, black 18%);
  }

  .logo {
    position: absolute;
    top: 27%;
    width: clamp(76px, 9vw, 160px);
    aspect-ratio: 1;
    object-fit: contain;
    transform: translate(-50%, -50%);
  }

  .handley-man { left: 13%; }
  .handley-works { left: 49%; }

  @media (max-width: 640px) {
    .ceiling-fan {
      width: 100%;
      object-fit: cover;
      object-position: 77% center;
    }
    .bus-stop {
      width: 100%;
      object-position: 83% bottom;
      mask-image: none;
    }
    .handley-man { left: 18%; top: 54%; }
    .handley-works { left: 56%; top: 17%; }
  }
</style>
</head>
<body>
  <main class="hero">
    <img class="photo ceiling-fan" src="ceilingfan.png?v=30f4921" alt="Ceiling fan installation">
    <div class="bus-scene">
      <img class="photo bus-stop" src="busstop.png" alt="Circular bus shelter">
    </div>
    <img class="logo handley-man" src="handleyman.png" alt="The Handley Man">
    <img class="logo handley-works" src="handleyworks.png" alt="Handley Works">
  </main>
</body>
</html>
